<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />

<style>
  html, body, #root { height: 100%; margin: 0; }
  body {
    font-family: var(--f-sans);
    background: var(--c-beige-100);
    color: var(--c-text);
  }
  .impl-shell { display: flex; flex-direction: column; height: 100%; }
  .impl-bar {
    height: 56px;
    background: #1a2820;
    color: var(--c-bg);
    display: flex; align-items: center;
    padding: 0 22px; gap: 22px;
    border-bottom: 1px solid #0f1a14;
    flex-shrink: 0;
  }
  .impl-bar-brand { display: flex; align-items: center; gap: 10px; }
  .impl-bar-brand .mark {
    width: 28px; height: 28px;
    border: 1.5px solid var(--c-orange-400);
    border-radius: 50%;
    display: grid; place-items: center;
    font-family: var(--f-mincho); font-size: 14px;
    color: var(--c-orange-400);
  }
  .impl-bar-brand .name {
    font-family: var(--f-mincho);
    font-size: 14px; line-height: 1;
  }
  .impl-bar-brand .name small {
    display: block;
    font-family: var(--f-en);
    font-size: 9px; letter-spacing: 0.22em;
    color: var(--c-orange-400);
    margin-top: 4px;
  }
  .impl-bar-segs {
    display: flex; gap: 4px;
    background: rgba(255,255,255,0.06);
    padding: 4px; border-radius: var(--r-pill);
  }
  .impl-seg {
    background: none; border: 0; cursor: pointer;
    padding: 7px 16px; border-radius: var(--r-pill);
    font-family: inherit; font-size: 13px; font-weight: 500;
    color: rgba(250,245,236,0.65);
  }
  .impl-seg.is-active { background: var(--c-bg); color: var(--c-primary); font-weight: 600; }
  .impl-bar-meta { margin-left: auto; }
  .impl-pill {
    display: inline-block;
    background: rgba(200,112,58,0.16);
    color: var(--c-orange-400);
    padding: 5px 11px;
    border-radius: var(--r-pill);
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.04em;
  }
  .impl-stage {
    flex: 1; min-height: 0;
    position: relative;
  }
  .impl-stage > .pub-root,
  .impl-stage > .adm-root { height: 100%; }

  @media (max-width: 600px) {
    .impl-bar { padding: 0 14px; gap: 12px; }
    .impl-bar-brand .name small { display: none; }
    .impl-bar-meta { display: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

  <rect x="64" y="146" width="72" height="4" rx="2" fill="#2d5a3d" opacity="0.5"/>
  <text x="100" y="180" text-anchor="middle" font-family="Cormorant Garamond,serif" font-size="11" letter-spacing="2" fill="#2d5a3d">SATONOAJI MIKAWA</text>
</svg>
</template>
